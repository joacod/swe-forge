name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The formatting check compares commits, not the clean checkout.
          fetch-depth: 0

      - name: Run validation batch
        run: ./scripts/validate-swe-forge

      - name: Check diff formatting
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          zero_sha=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = pull_request ]; then
            # GITHUB_SHA is the tested pull-request merge revision.
            git diff --check "$BASE_SHA...$CURRENT_SHA"
          elif [ "$BEFORE_SHA" = "$zero_sha" ]; then
            # A newly-created branch has no push range; check its pushed commit.
            if git rev-parse "$CURRENT_SHA^" >/dev/null 2>&1; then
              git diff --check "$CURRENT_SHA^..$CURRENT_SHA"
            else
              empty_tree=$(git mktree </dev/null)
              git diff --check "$empty_tree" "$CURRENT_SHA"
            fi
          else
            git diff --check "$BEFORE_SHA..$CURRENT_SHA"
          fi

  pi-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Run Pi runtime fixture
        env:
          SWE_FORGE_PI_CI: "1"
        run: ./scripts/test-swe-forge-pi

  macos-core:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check shell syntax
        run: sh -n scripts/lib/registry.sh scripts/swe-forge scripts/check-swe-forge scripts/test-swe-forge scripts/validate-swe-forge scripts/test-swe-forge-gate scripts/test-swe-forge-isolated scripts/swe-forge-gate scripts/swe-forge-state scripts/swe-forge-isolated-gate scripts/test-swe-forge-pi .swe-forge/tools/swe-forge-gate .swe-forge/tools/swe-forge-state .swe-forge/tools/swe-forge-isolated-gate

      - name: Run structural checks
        run: ./scripts/check-swe-forge

      - name: Run executable evidence fixtures
        run: ./scripts/test-swe-forge-gate

      - name: Run isolated worktree fixtures
        run: ./scripts/test-swe-forge-isolated

      - name: Run Pi runtime fixture
        run: ./scripts/test-swe-forge-pi

      - name: Prepare release readiness
        run: ./scripts/check-release prepare --allow-dirty

      - name: Check diff formatting
        run: git diff --check
