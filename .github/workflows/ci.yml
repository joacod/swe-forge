name: CI

# Pull requests provide pre-merge canonical confidence. Main, release, and
# manual runs also build and clean-room test the supported standalone targets.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Formatting checks compare commits, not the clean checkout.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency policy
        run: bun run check:dependencies
      - name: Audit Bun package contents
        run: bun run check:package

      - name: Type-check TypeScript
        run: bun run typecheck

      - name: Run Bun tests
        run: bun run test

      - name: Run canonical validation
        run: ./scripts/validate-swe-forge core invocation installer workers

      - name: Check pull request diff formatting
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA...$CURRENT_SHA"

      - name: Check main push diff formatting
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: git diff --check "$BEFORE_SHA..$CURRENT_SHA"

      - name: Run release readiness validation
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: ./scripts/validate-swe-forge release

      - name: Check release commit formatting
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: git diff --check HEAD^..HEAD

  standalone:
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: bun-darwin-arm64
            platform: darwin
            architecture: arm64
          - runner: ubuntu-24.04
            target: bun-linux-x64
            platform: linux
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Check release consistency
        run: ./scripts/check-release prepare

      - name: Build standalone release artifact
        run: bun run build:release -- --target ${{ matrix.target }}

      - name: Run clean-room standalone validation
        run: |
          version=$(awk 'NR == 1 { print; exit }' VERSION)
          artifact="build/releases/v${version}/swe-forge-v${version}-${{ matrix.platform }}-${{ matrix.architecture }}"
          bun run scripts/test-standalone-release.ts "$artifact"
